<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistema PAS Marista</title>
<meta name="description" content="Sistema de elaboração, revisão, aplicação e correção dos simulados no formato PAS/UnB — Colégio Marista Águas Claras.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231d5cff'/><text y='68' x='50' text-anchor='middle' font-size='40' font-family='Arial' font-weight='bold' fill='%23fff'>PAS</text></svg>">
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>
<a class="pular" href="#app">Pular para o conteúdo</a>
<div class="casca">
  <!-- Menu lateral: identidade, prova em que se trabalha, telas e quem está logado. -->
  <aside class="lado" id="lado">
    <div class="lado-marca">
      <div class="logo"><span>PAS</span></div>
      <div class="lado-marca-txt">
        <b>Sistema PAS</b>
        <small>Marista Águas Claras</small>
      </div>
      <button class="lado-fechar" data-acao="menu-fechar" aria-label="Fechar o menu">✕</button>
    </div>
    <div class="lado-prova" id="lado-prova"></div>
    <nav class="lado-nav" id="nav" aria-label="Telas do sistema"></nav>
    <div class="lado-pe" id="quem"></div>
  </aside>
  <!-- Véu que escurece o conteúdo quando o menu vira gaveta, na tela estreita. -->
  <div class="lado-veu" id="lado-veu" data-acao="menu-fechar" hidden></div>

  <div class="coluna">
    <header class="topo">
      <button class="menu-btn" data-acao="menu-abrir" aria-label="Abrir o menu" aria-controls="lado" aria-expanded="false">☰</button>
      <div class="topo-txt">
        <h1 id="h-titulo">Sistema PAS Marista</h1>
        <p id="h-sub"></p>
      </div>
    </header>
    <main id="app" tabindex="-1"></main>
  </div>
</div>
<div id="print-area" aria-hidden="true"></div>
<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
