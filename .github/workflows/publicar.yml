name: Publicar no GitHub Pages

# O sistema é um site estático (HTML/CSS/JS, sem build): o repositório inteiro
# vira a página. Roda na branch de trabalho e na branch padrão.
on:
  push:
    branches:
      - claude/retomar-projeto-pas-catxkd
      - claude/locate-created-files-xzeih0
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Montar o site
        run: |
          mkdir -p site
          cp index.html site/
          cp -r css js site/
          touch site/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: publicacao
        uses: actions/deploy-pages@v4
